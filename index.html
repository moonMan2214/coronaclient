<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corona Client</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:#030305;
  color:#fff;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 50% 48%,rgba(106,72,255,.18),transparent 31%),
    radial-gradient(circle at 50% 100%,rgba(51,25,140,.15),transparent 48%),
    linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.48));
}
.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 180px 55px rgba(0,0,0,.58);
}
main{
  position:relative;z-index:3;height:100%;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
}
.content{transform:translateY(-1vh);padding:30px}
.logo{
  width:96px;height:96px;margin:0 auto 30px;
  display:block;object-fit:cover;border-radius:18px;
  box-shadow:0 0 45px rgba(124,87,255,.30);
}
h1{
  margin:0;
  font-size:clamp(48px,7vw,76px);
  line-height:.95;
  letter-spacing:-4px;
  font-weight:850;
  text-shadow:0 4px 35px rgba(0,0,0,.6);
}
h1 span{
  background:linear-gradient(180deg,#fff 10%,#c9baff 55%,#8569e8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
p{
  margin:19px auto 29px;
  max-width:510px;
  color:rgba(224,222,234,.62);
  font-size:14px;line-height:1.7;
}
.download{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:158px;height:45px;padding:0 22px;
  border-radius:8px;
  color:#08070c;
  background:#fff;
  font-size:13px;font-weight:800;
  box-shadow:0 10px 45px rgba(0,0,0,.3),0 0 35px rgba(128,93,255,.14);
  transition:transform .2s,box-shadow .2s;
}
.download:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 50px rgba(0,0,0,.38),0 0 45px rgba(128,93,255,.28);
}
.beta{
  margin-top:14px;color:rgba(255,255,255,.28);
  font-size:10px;letter-spacing:.7px;text-transform:uppercase
}
.corner{
  position:fixed;z-index:4;left:0;right:0;bottom:22px;
  text-align:center;color:rgba(255,255,255,.2);font-size:10px
}
@media(max-width:600px){
 .logo{width:76px;height:76px;border-radius:16px}
 h1{letter-spacing:-3px}
 p{font-size:13px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="overlay"></div><div class="vignette"></div>

<main>
  <div class="content">
    <img class="logo" src="corona-icon.png" alt="Corona Client icon">
    <h1>Corona <span>Client</span></h1>
    <p>A modern client built for a fast, clean and focused experience.</p>
    <a class="download" href="CoronaClient.zip" download>Download</a>
    <div class="beta">Public Beta · Windows</div>
  </div>
</main>

<div class="corner">© 2026 Moon Softworks</div>

<script>
const canvas=document.getElementById("bg"),ctx=canvas.getContext("2d");
let w,h,dpr,stars=[],mouse={x:-1000,y:-1000};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  w=innerWidth;h=innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:95},()=>({
    x:Math.random()*w,y:Math.random()*h,
    r:Math.random()*1.25+.25,
    a:Math.random()*.55+.12,
    vx:(Math.random()-.5)*.035,
    vy:(Math.random()-.5)*.025
  }));
}
function frame(){
  ctx.clearRect(0,0,w,h);

  const glow=ctx.createRadialGradient(
    w*.5,h*.52,0,w*.5,h*.52,Math.max(w,h)*.62
  );
  glow.addColorStop(0,"rgba(108,76,255,.10)");
  glow.addColorStop(.42,"rgba(49,28,130,.035)");
  glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);

  for(const s of stars){
    s.x+=s.vx;s.y+=s.vy;
    if(s.x<0)s.x=w;if(s.x>w)s.x=0;
    if(s.y<0)s.y=h;if(s.y>h)s.y=0;
    const d=Math.hypot(s.x-mouse.x,s.y-mouse.y);
    const boost=d<170?(1-d/170)*.35:0;
    ctx.fillStyle=`rgba(188,170,255,${s.a+boost})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r+(boost*.7),0,Math.PI*2);ctx.fill();
  }

  requestAnimationFrame(frame);
}
addEventListener("resize",resize);
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
resize();frame();
</script>
</body>
</html>
